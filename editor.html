<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>主页内容编辑｜贾奥坤</title><link rel="stylesheet" href="styles.css">
</head>
<body class="editor-page">
  <header class="editor-header"><a class="brand" href="index.html"><span class="brand-mark">JAK</span><span>返回个人主页</span></a></header>
  <main class="editor-shell">
    <section class="editor-intro"><p class="eyebrow">EASY EDITOR</p><h1>主页内容编辑</h1><p>直接修改下面的文字即可。保存后会立即应用到当前浏览器；若要让所有访客看到更新，请下载更新文件并发给 Codex，说明“帮我重新发布个人主页”。</p></section>
    <form id="content-form" class="editor-form">
      <label>姓名<input name="name" autocomplete="name"></label>
      <label>个人标题<input name="headline"></label>
      <label class="full">个人简介<textarea name="summary" rows="5"></textarea></label>
      <label class="full">“关于我”正文<textarea name="aboutText" rows="5"></textarea></label>
      <label>邮箱<input name="email" type="email" autocomplete="email"></label>
      <label>电话<input name="phone" autocomplete="tel"></label>
      <label>QQ<input name="qq"></label><label>微信<input name="wechat"></label>
      <label>求职方向<input name="jobDirection" placeholder="例如：央国企技术岗"></label>
      <label>工作地点<input name="workLocation" placeholder="例如：北京"></label>
      <label class="full">页面结尾主标题<input name="contactHeading" placeholder="例如：期待在技术岗位上创造长期价值"></label>
      <label>公众号累计推文<input name="wechatPosts" placeholder="例如：800+"></label>
      <label>公众号粉丝数<input name="wechatFollowers" placeholder="例如：9500+"></label>
      <label>公众号2026年上半年阅读量<input name="wechatViews" placeholder="例如：43w+"></label>
      <div class="editor-actions full"><button class="button primary" type="submit">保存并查看主页</button><button class="button secondary" id="download-data" type="button">下载更新文件</button><button class="text-button" id="reset-data" type="button">恢复默认内容</button></div>
    </form>
    <aside class="editor-note"><strong>隐私提醒</strong><p>请不要在公开主页中填写身份证号、家庭住址、证书验证码、账号密码等敏感信息。</p></aside>
  </main>
  <div class="toast" role="status" aria-live="polite"></div><script src="editor.js"></script>
</body>
</html>
